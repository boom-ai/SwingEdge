name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          for i in 1 2 3 4; do
            echo "T $(date -u +%H:%M:%S)"
            curl -s -L -o /tmp/c -w "%{http_code} %{size_download} " -H "User-Agent: $UA" "https://www.nseindia.com/api/option-chain-v3?type=Indices&symbol=NIFTY&expiry=23-Nov-2026&_=$RANDOM$RANDOM"; python3 -c "import json;d=json.load(open('/tmp/c'));r=d['records'];x=[y for y in r['data'] if y.get('strikePrice')==25300][0];print('chain',r.get('timestamp'),r.get('underlyingValue'),x['CE']['lastPrice'],x['CE']['buyPrice1'],x['CE']['sellPrice1'])" 2>&1 | tail -1
            curl -s -L -o /tmp/d -w "%{http_code} " -H "User-Agent: $UA" "https://www.nseindia.com/api/option-chain-contract-info?symbol=NIFTY&_=$RANDOM"; head -c 60 /tmp/d; echo
            sleep 10
          done
