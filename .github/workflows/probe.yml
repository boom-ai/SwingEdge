name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          g(){ curl -sS -m 60 -A "$UA" -H "Accept: application/json, text/plain, */*" -o "$2" -w "%{http_code} $1\n" "$1" || true; }
          B=https://www.nseindia.in/api
          g "$B/corporate-share-holdings-master?index=equities" /tmp/m.json
          g "$B/corporate-share-holdings-master?index=equities&symbol=TATAMOTORS" /tmp/t.json
          g "$B/corporate-share-holdings-master?index=equities&from_date=01-08-2026&to_date=14-11-2026" /tmp/m2.json
          g "$B/corporates-pit?index=equities&from_date=01-11-2026&to_date=14-11-2026" /tmp/pit.json
          g "$B/fiidiiTradeReact" /tmp/fii.json
          python3 - <<'PY'
          import json
          for f in ["/tmp/m.json","/tmp/t.json","/tmp/m2.json","/tmp/pit.json","/tmp/fii.json"]:
              try:
                  d=json.load(open(f))
              except Exception as e:
                  print(f,"ERR",e,open(f,errors="replace").read(200)); continue
              rows = d if isinstance(d,list) else d.get("data", d)
              print("==",f,type(d).__name__, len(rows) if hasattr(rows,'__len__') else '')
              if isinstance(rows,list) and rows:
                  print(json.dumps(rows[0])[:1500]); print(json.dumps(rows[-1])[:600])
                  if "date" in rows[0]:
                      from collections import Counter; print(Counter(r.get("date") for r in rows).most_common(6))
              else: print(json.dumps(d)[:800])
          PY
          x=$(python3 -c "import json;d=json.load(open('/tmp/t.json'));r=d if isinstance(d,list) else d['data'];print(r[0].get('xbrl',''))" 2>/dev/null); echo "XBRL $x"
          [ -n "$x" ] && curl -sS -m 60 -A "$UA" -o /tmp/x.xml -w "%{http_code}\n" "$x" && wc -c /tmp/x.xml && grep -o "<in-bse-shp:[A-Za-z]*" /tmp/x.xml | sort | uniq -c | sort -rn | head -60
          grep -iE "ForeignPortfolio|MutualFund|Promoter" /tmp/x.xml | head -20 | cut -c1-250
