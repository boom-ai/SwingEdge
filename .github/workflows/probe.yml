name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          for i in 1 2 3 4 5 6 7; do
            echo "T $(date -u +%H:%M:%S)"
            curl -s -L -o /tmp/a -H "User-Agent: $UA" "https://www.nseindia.com/api/equity-stockIndices?index=NIFTY%2050"; python3 -c "import json;d=json.load(open('/tmp/a'));print('stockIndices',d.get('timestamp'),d['data'][0]['lastPrice'])" 2>&1 | tail -1
            curl -s -L -o /tmp/b -H "User-Agent: $UA" "https://www.nseindia.com/api/marketStatus"; python3 -c "import json;d=json.load(open('/tmp/b'));m=d['marketState'][0];print('mktStatus',m.get('tradeDate'),m.get('last'))" 2>&1 | tail -1
            curl -s -L -o /tmp/c -H "User-Agent: $UA" "https://www.nseindia.com/api/allIndices?t=$RANDOM"; python3 -c "import json;d=json.load(open('/tmp/c'));print('allIdx-nocache',d.get('timestamp'),d['data'][0]['last'])" 2>&1 | tail -1
            curl -s -o /tmp/y -w "%{http_code} " -H "User-Agent: $UA" "https://query2.finance.yahoo.com/v8/finance/chart/%5ENSEI?range=1d&interval=1m"; python3 -c "import json,time;m=json.load(open('/tmp/y'))['chart']['result'][0]['meta'];print('yahoo',m.get('regularMarketPrice'),int(time.time())-m.get('regularMarketTime',0),'s old')" 2>&1 | tail -1
            sleep 9
          done
