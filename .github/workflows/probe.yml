name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          curl -s -L -o /tmp/e -w "eqchain %{http_code} %{size_download}\n" -H "User-Agent: $UA" "https://www.nseindia.in/api/option-chain-v3?type=Equity&symbol=RELIANCE&expiry=23-Nov-2026&_=3"; python3 -c "import json;d=json.load(open('/tmp/e'))['records'];print(d['timestamp'],d['underlyingValue'],len(d['data']))"
          curl -s -L -o /tmp/e -w "finv3 %{http_code} %{size_download}\n" -H "User-Agent: $UA" "https://www.nseindia.in/api/option-chain-v3?type=Indices&symbol=FINNIFTY&expiry=23-Nov-2026&_=3"
          for s in reliance finnifty midcpnifty; do curl -s -o /tmp/g -w "groww $s %{http_code} %{size_download} " -H "User-Agent: $UA" "https://groww.in/v1/api/option_chain_service/v1/option_chain/$s?expiry=2026-11-23"; head -c 120 /tmp/g; python3 -c "import json;d=json.load(open('/tmp/g'));o=d['optionChain'];r=o['optionChains'];print(o['expiryDetailsDto'], len(r), r[len(r)//2]['callOption'].get('growwContractId'))" 2>&1 | tail -1; done
          curl -s -w " [%{http_code}]\n" -H "User-Agent: $UA" "https://groww.in/v1/api/option_chain_service/v1/option_chain/nifty" | head -c 100; echo
