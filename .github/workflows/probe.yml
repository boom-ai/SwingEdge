name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Mobile Safari/537.36"
          H=https://www.nseindia.com
          for P in "/api/option-chain-v3?type=Indices&symbol=NIFTY&expiry=23-Nov-2026" "/api/option-chain-contract-info?symbol=BANKNIFTY"; do
            curl -sS -m 20 -A "$UA" -H "Accept: application/json" -o /tmp/o -w "%{http_code} %{size_download} %{time_total}s $P\n" "$H$P" || true
            python3 -c "
          import json,sys
          d=json.load(open('/tmp/o')); r=d.get('records',d)
          print({k:(v if not isinstance(v,list) else str(v[:3])+'..%d'%len(v)) for k,v in r.items() if k!='data'})
          rows=r.get('data',[])
          print(len(rows)); 
          if rows:
              m=rows[len(rows)//2]; print(json.dumps(m)[:1500])
          " || head -c 300 /tmp/o
          done
          for k in 1 2 3; do curl -sS -m 20 -A "$UA" -o /dev/null -w "repeat %{http_code} %{time_total}s\n" "$H/api/option-chain-v3?type=Indices&symbol=NIFTY&expiry=23-Nov-2026"; sleep 2; done
