name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          curl -s -L -o /tmp/u -w "underlying %{http_code} %{size_download}\n" -H "User-Agent: $UA" "https://www.nseindia.in/api/underlying-information?_=1"; python3 -c "import json;d=json.load(open('/tmp/u'));x=d['data'];print(list(x.keys()), len(x['IndexList']), len(x['UnderlyingList']), x['IndexList'][:6], x['UnderlyingList'][:2])"
          curl -s -L -w " info %{http_code}\n" -H "User-Agent: $UA" "https://www.nseindia.in/api/option-chain-contract-info?symbol=RELIANCE&_=2" | head -c 200; echo
          curl -s -L -o /tmp/e -w "eqchain %{http_code} %{size_download}\n" -H "User-Agent: $UA" "https://www.nseindia.in/api/option-chain-v3?type=Equity&symbol=RELIANCE&expiry=24-Nov-2026&_=3"; head -c 300 /tmp/e; echo
          curl -s -L -o /tmp/f -w "finchain %{http_code} %{size_download}\n" -H "User-Agent: $UA" "https://www.nseindia.in/api/option-chain-contract-info?symbol=FINNIFTY&_=4"; head -c 200 /tmp/f; echo
          for s in reliance finnifty midcpnifty hdfcbank m%26m; do curl -s -o /tmp/g -w "groww $s %{http_code} %{size_download} " -H "User-Agent: $UA" "https://groww.in/v1/api/option_chain_service/v1/option_chain/$s"; python3 -c "import json;d=json.load(open('/tmp/g'));o=d['optionChain'];r=o['optionChains'];print(o['expiryDetailsDto'], len(r), r[len(r)//2]['callOption'].get('growwContractId'), r[len(r)//2]['callOption'].get('ltp'))" 2>&1 | tail -1; done
          curl -s -o /tmp/y -w "yahoo5m %{http_code}\n" -H "User-Agent: $UA" "https://query1.finance.yahoo.com/v8/finance/chart/RELIANCE.NS?range=1d&interval=5m"
