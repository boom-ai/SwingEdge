name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          curl -s -L -o /tmp/l -w "lots %{http_code} %{size_download}\n" -H "User-Agent: $UA" "https://nsearchives.nseindia.com/content/fo/fo_mktlots.csv"; head -c 400 /tmp/l; echo; grep -i "RELIANCE\|M&M\|^ *IDEA" /tmp/l | head -3
          curl -s -H "User-Agent: $UA" -H "Content-Type: application/json" -X POST -d '{"exchangeAggReqMap":{"NSE":{"priceSymbolList":["RELIANCE"],"indexSymbolList":["NIFTYNXT50","NIFTY"]}}}' "https://groww.in/v1/api/stocks_data/v1/tr_live_delayed/segment/CASH/latest_aggregated" | head -c 700; echo
