name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          f(){ code=$(curl -sS -m 30 -A "$UA" -H "Accept: application/json, text/plain, */*" -H "Referer: https://www.bseindia.com/" -H "Origin: https://www.bseindia.com" -b /tmp/c -c /tmp/c -o /tmp/o -w "%{http_code}" "$1" 2>&1); echo "== $1 -> $code $(wc -c </tmp/o 2>/dev/null)"; head -c ${2:-400} /tmp/o; echo; }
          f https://www.bseindia.com/ 100
          f "https://api.bseindia.com/BseIndiaAPI/api/ListofScripData/w?Group=&Scripcode=&industry=&segment=Equity&status=Active" 600
          f "https://api.bseindia.com/BseIndiaAPI/api/shpSecSummery_New/w?qtrid=&scripcode=500325" 1500
          f "https://api.bseindia.com/BseIndiaAPI/api/SHPQNewFormat/w?scripcode=500325&qtrid=" 800
          f "https://api.bseindia.com/BseIndiaAPI/api/InsiderTrade15/w?scripcode=&fromdt=20261101&todt=20261113" 800
          f "https://www.bseindia.com/corporates/shpSecurities.aspx?scripcd=500325" 300
          f "https://nsearchives.nseindia.com/content/equities/block.csv" 300
          f "https://nsearchives.nseindia.com/content/fo/fii_stats_13-Nov-2026.xls" 100
          f "https://query1.finance.yahoo.com/v10/finance/quoteSummary/RELIANCE.NS?modules=majorHoldersBreakdown" 300
          f "https://www.screener.in/api/company/search/?q=reliance" 300
          f "https://trendlyne.com/" 100
          f "https://www.moneycontrol.com/" 100
          f "https://www.tickertape.in/" 100
          f "https://www.nseindia.com/api/corporate-share-holdings-master?index=equities" 300
          curl -sS -m 30 -A "$UA" -L -o /tmp/o -w "%{http_code} %{url_effective}\n" "https://www.nseindia.com/api/corporate-share-holdings-master?index=equities"; head -c 200 /tmp/o; echo
