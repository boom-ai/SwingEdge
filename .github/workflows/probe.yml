name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36'
          C=NIFTY26NOV25300CE
          for u in "https://groww.in/v1/api/stocks_fo_data/v1/tr_live_prices/exchange/NSE/segment/FNO/$C/latest" \
                   "https://groww.in/v1/api/stocks_fo_data/v1/tr_live_book/exchange/NSE/segment/FNO/$C/latest" \
                   "https://groww.in/v1/api/stocks_data/v1/tr_live_book/exchange/NSE/segment/FNO/$C/latest" \
                   "https://groww.in/v1/api/stocks_fo_data/v1/accord_points/exchange/NSE/segment/FNO/$C/latest_prices_ohlc"; do
            echo "U $u"; curl -s -w " [%{http_code}]" -H "User-Agent: $UA" "$u" | head -c 700; echo
          done
          echo "POST"; curl -s -w " [%{http_code}]" -H "User-Agent: $UA" -H "Content-Type: application/json" -X POST -d '["NIFTY","BANKNIFTY","INDIAVIX"]' "https://groww.in/v1/api/stocks_data/v1/accord_points/exchange/NSE/segment/CASH/latest_indices_ohlc_batch" | head -c 300; echo
          echo "POST2"; curl -s -w " [%{http_code}]" -H "User-Agent: $UA" -H "Content-Type: application/json" -X POST -d '{"exchangeAggReqMap":{"NSE":{"priceSymbolList":[],"indexSymbolList":["NIFTY","BANKNIFTY","INDIAVIX","FINNIFTY","MIDCPNIFTY"]}}}' "https://groww.in/v1/api/stocks_data/v1/tr_live_delayed/segment/CASH/latest_aggregated" | head -c 600; echo
          echo "POST3"; curl -s -w " [%{http_code}]" -H "User-Agent: $UA" -H "Content-Type: application/json" -X POST -d "[\"$C\",\"NIFTY26NOV25300PE\"]" "https://groww.in/v1/api/stocks_fo_data/v1/tr_live_prices/exchange/NSE/segment/FNO/latest_prices_batch" | head -c 600; echo
