name: whole-market scan
# Every NSE (EQ/BE/BZ/SM/ST) + BSE-only equity, scored with the app's own Kotlin code -> data/scan.csv + data/scan_meta.json,
# plus tomorrow's intraday calls with their back-test record (data/intraday.csv) and NSE trading holidays (data/holidays.json).
# Daily bhavcopies are kept in the Actions cache (rolling ~275 sessions); a lost cache is simply re-downloaded.
on:
  schedule:
    - cron: "45 14 * * 1-5"   # 20:15 IST, after NSE and BSE publish the day's bhavcopy
    - cron: "15 2 * * 2-6"    # 07:45 IST catch-up for a late or failed evening run
  workflow_dispatch:
    inputs:
      sessions:
        description: "sessions of history to keep (>= 253 for 12-month scores)"
        default: "275"
permissions:
  contents: write
concurrency: { group: scan, cancel-in-progress: false }
env:
  KOTLIN_VERSION: "2.0.21"
  BHAV_DIR: /tmp/bhavall
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Restore bhavcopy cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BHAV_DIR }}
          key: bhavall-${{ github.run_id }}
          restore-keys: bhavall-

      - name: Download missing bhavcopies (NSE + BSE)
        timeout-minutes: 100
        run: |
          python3 -u tools/bhavsync.py "$BHAV_DIR" "${{ github.event.inputs.sessions || '275' }}" || echo "bhavsync failed; using what is cached"
          ls "$BHAV_DIR" | wc -l

      - name: NSE trading holidays + index closes (nightly calls)
        run: |
          set -u
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sS -m 30 -A "$UA" -c /tmp/ck -o /dev/null https://www.nseindia.com/ || true
          curl -sS -L --compressed -m 60 -A "$UA" -H "Accept: application/json,*/*" -H "Referer: https://www.nseindia.com/resources/exchange-communication-holidays" \
            -c /tmp/ck -b /tmp/ck -o /tmp/holidays_api.json -w "holiday api: %{http_code} %{size_download}\n" "https://www.nseindia.com/api/holiday-master?type=trading" || echo "holiday api: curl failed"
          python3 tools/holidays.py /tmp/holidays_api.json data/holidays.json || true
          last=$(ls "$BHAV_DIR" | grep -E '^nse(full)?_[0-9]{8}' | grep -oE '[0-9]{8}' | sort | tail -1 || true)
          if [ -n "$last" ]; then
            ddmmyyyy="${last:6:2}${last:4:2}${last:0:4}"
            curl -sS -L -m 60 -A "$UA" -o /tmp/ind_close_all.csv -w "index closes $ddmmyyyy: %{http_code} %{size_download}\n" \
              "https://nsearchives.nseindia.com/content/indices/ind_close_all_${ddmmyyyy}.csv" || true
            if grep -qi "Index Name" /tmp/ind_close_all.csv 2>/dev/null; then cp /tmp/ind_close_all.csv "$BHAV_DIR/ind_close_all.csv"; else rm -f "$BHAV_DIR/ind_close_all.csv"; fi
          fi

      - name: Save bhavcopy cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BHAV_DIR }}
          key: bhavall-${{ github.run_id }}

      - name: Kotlin compiler (cached)
        id: kc
        uses: actions/cache@v4
        with:
          path: /tmp/kotlinc
          key: kotlinc-${{ env.KOTLIN_VERSION }}
      - name: Install Kotlin compiler
        if: steps.kc.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            curl -fsSL -o /tmp/kc.zip "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" && break; sleep 10
          done
          unzip -q /tmp/kc.zip -d /tmp && ls /tmp/kotlinc/bin/kotlinc

      - name: Scanner jar (cached per source hash)
        id: jar
        uses: actions/cache@v4
        with:
          path: /tmp/scanjar
          key: scanjar-${{ env.KOTLIN_VERSION }}-${{ hashFiles('app/src/main/java/com/boomai/swingedge/core/*.kt', 'scan/*.kt') }}
      - name: Compile scanner (the app's core + scan/ScanMain.kt)
        if: steps.jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/scanjar
          /tmp/kotlinc/bin/kotlinc app/src/main/java/com/boomai/swingedge/core/*.kt scan/*.kt -include-runtime -nowarn -d /tmp/scanjar/scan.jar

      - name: Scan the whole market
        id: scan
        run: |
          set +e
          java -Xmx6g -cp /tmp/scanjar/scan.jar com.boomai.swingedge.scan.ScanMainKt "$BHAV_DIR" data/symbols.csv data/industries.csv \
            data/scan.csv data/scan_meta.json "${{ github.event.inputs.sessions || '275' }}"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ $rc -eq 2 ]; then echo "::warning::scan not written (too little data or older than the current file) - keeping the last good data/scan.csv"; exit 0; fi
          exit $rc

      - name: Commit if changed
        if: steps.scan.outputs.rc == '0' || steps.scan.outputs.rc == '2'
        run: |
          head -c 300 data/scan_meta.json; echo
          git config user.name "swingedge-bot"; git config user.email "actions@users.noreply.github.com"
          head -c 600 data/intraday.csv 2>/dev/null || true; echo
          git add data/scan.csv data/scan_meta.json data/holidays.json
          [ -f data/intraday.csv ] && git add data/intraday.csv
          [ -f data/rating.csv ] && git add data/rating.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -qm "Whole-market scan $(python3 -c 'import json;print(json.load(open("data/scan_meta.json"))["asof"])')"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin main && break; sleep $((i * 5)); done
